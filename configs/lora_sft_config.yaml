# PRJ-07: CyberReason - Supervised Fine-Tuning (SFT) Configuration
model:
  base_model_name: "Qwen/Qwen2.5-7B-Instruct"
  fallback_model_name: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
  quantization_bits: 4
  compute_dtype: "bfloat16"
  use_gradient_checkpointing: true

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training:
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  num_train_epochs: 3
  weight_decay: 0.01
  max_seq_length: 2048
  logging_steps: 10
  save_strategy: "epoch"
  seed: 42
